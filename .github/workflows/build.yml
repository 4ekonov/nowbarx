name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          brew install ldid xz make dpkg
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/sdks
          mkdir -p $HOME/theos/sdks
          cp -R $HOME/sdks/*.sdk $HOME/theos/sdks/
      - name: Build
        run: |
          export THEOS=$HOME/theos
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make package
      - uses: actions/upload-artifact@v4
        with:
          name: NowBarX-deb
          path: packages/*.deb
